<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>泥酔書道パフォーマンス！</title>
<meta name="description" content="ふらふらの酔っ払いを操作して巨大な紙にお題を書く、千鳥足の書道パフォーマンスゲーム。どんな失敗作も金屏風の前に厳粛に展示されます。">
<meta name="theme-color" content="#1a1410">
<meta property="og:type" content="website">
<meta property="og:title" content="泥酔書道パフォーマンス！">
<meta property="og:description" content="千鳥足で巨大な筆をふるい、お題との一致率を競え。どんな失敗作も金屏風の前に飾られる。">
<meta property="og:site_name" content="泥酔書道パフォーマンス！">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="泥酔書道パフォーマンス！">
<meta name="twitter:description" content="千鳥足で巨大な筆をふるい、お題との一致率を競え。どんな失敗作も金屏風の前に飾られる。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1410'/%3E%3Cpath d='M14 50 C24 34 34 22 50 12 L54 16 C40 28 30 40 20 54 Z' fill='%23f4ecd8'/%3E%3Ccircle cx='17' cy='51' r='6' fill='%23c8102e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/fonts/yuji-syuku-400.css">
<link rel="stylesheet" href="./css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<div id="loading" class="loading">墨を磨っています…</div>

<!-- タイトル -->
<section id="scr-title" class="screen" hidden>
  <div class="title-box">
    <h1 class="logo"><span class="logo-sub">泥酔</span><span class="logo-main">書道パフォーマンス<span class="bang">！</span></span></h1>
    <ol class="howto">
      <li>千鳥足の酔っ払いで、巨大な紙にお題を書け。</li>
      <li><b>移動</b> WASD・矢印 / 画面を触って動かす　<b>書く</b> Space長押し / 筆ボタン</li>
      <li>墨が切れたら硯へ。墨を踏んだ足は足ふきマットで拭け。</li>
    </ol>
    <p id="challenge" class="challenge" hidden></p>
    <button id="btn-start" class="btn btn-primary">はじめる</button>
    <button id="btn-other" class="btn btn-ghost" hidden>ほかのお題を選ぶ</button>
  </div>
</section>

<!-- お題選択 -->
<section id="scr-select" class="screen" hidden>
  <div class="select-box">
    <h2 class="heading">お題を選べ</h2>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="odai-grid" id="odai-grid"></div>
    <div class="select-foot">
      <label class="toggle"><input type="checkbox" id="guide-toggle" checked><span class="sw"></span><span>下書き（薄いお手本）</span></label>
      <button id="btn-omakase" class="btn btn-primary">おまかせ</button>
      <button id="btn-back" class="btn btn-ghost">戻る</button>
    </div>
  </div>
</section>

<!-- プレイ HUD -->
<section id="hud" class="screen" hidden>
  <div id="touch-zone" class="touch-zone"></div>
  <div class="hud-top" id="hud-top">
    <div class="hud-row">
      <canvas id="thumb" class="thumb" width="128" height="128"></canvas>
      <div class="hud-odai"><small>お題</small><span id="hud-odai-text"></span></div>
      <div class="hud-time"><small>残り</small><span id="hud-time">60</span></div>
      <div class="hud-spacer"></div>
      <button id="btn-retry" class="btn-icon" title="やり直し（タイトルへ）" aria-label="やり直し">戻</button>
    </div>
    <div class="hud-row">
      <div class="gauge" id="gauge" title="墨ゲージ">
        <svg viewBox="0 0 160 28" width="160" height="28" aria-hidden="true">
          <defs>
            <clipPath id="brush-clip">
              <rect x="2" y="9" width="96" height="10" rx="3"/>
              <path d="M98 6 L112 4 C132 4 150 10 158 14 C150 18 132 24 112 24 L98 22 Z"/>
            </clipPath>
          </defs>
          <g clip-path="url(#brush-clip)">
            <rect x="0" y="0" width="160" height="28" fill="#8d7b63"/>
            <rect id="gauge-fill" x="0" y="0" width="160" height="28" fill="#0d0b0a"/>
          </g>
          <rect x="2" y="9" width="96" height="10" rx="3" fill="none" stroke="#e8c766" stroke-width="1.2"/>
          <path d="M98 6 L112 4 C132 4 150 10 158 14 C150 18 132 24 112 24 L98 22 Z" fill="none" stroke="#e8c766" stroke-width="1.2"/>
          <line x1="34" y1="9" x2="34" y2="19" stroke="#e8c766" stroke-width="1"/>
          <line x1="68" y1="9" x2="68" y2="19" stroke="#e8c766" stroke-width="1"/>
        </svg>
        <span id="gauge-num" class="gauge-num">100</span>
      </div>
      <div class="foot" id="foot"><svg viewBox="0 0 20 32" width="14" height="22" aria-hidden="true"><ellipse cx="10" cy="10" rx="8" ry="9"/><ellipse cx="10" cy="25" rx="6.5" ry="6.5"/></svg><span id="foot-text">足の裏: きれい</span></div>
      <button id="btn-done" class="btn btn-small">書き上げた！</button>
    </div>
  </div>
  <div id="joy-base" class="joy-base"><div id="joy-knob" class="joy-knob"></div></div>
  <button id="btn-brush" class="btn-brush" aria-label="筆を下ろす（長押し）"><span>筆</span></button>
  <div id="callout" class="callout"></div>
  <div id="toast" class="toast"></div>
</section>

<!-- 結果 -->
<section id="scr-result" class="screen" hidden>
  <div class="curtain left" id="curtain-l"></div>
  <div class="curtain right" id="curtain-r"></div>
  <div class="result-panel" id="result-panel">
    <div class="res-head">
      <div class="res-title" id="res-title">題『』</div>
      <div class="res-score"><small>一致率</small><span id="res-score">0</span><small>%</small></div>
    </div>
    <div class="res-rank" id="res-rank"></div>
    <p class="res-comment" id="res-comment"></p>
    <div class="res-buttons" id="res-buttons">
      <button id="btn-share" class="btn btn-primary">SNSに投稿</button>
      <button id="btn-save" class="btn">画像を保存</button>
      <button id="btn-again" class="btn">もう一度</button>
      <button id="btn-change" class="btn btn-ghost">お題を変える</button>
    </div>
    <p class="res-note" id="res-note" hidden></p>
  </div>
</section>

<button id="btn-mute" class="btn-icon btn-mute" title="音のオン/オフ" aria-label="ミュート切替">音</button>

<script type="module" src="./js/main.js"></script>
</body>
</html>
